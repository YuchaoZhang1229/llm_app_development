[project]
name = "llm-app-development"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "arxiv==2.3.0",
    "chromadb>=1.5.9",
    "dashscope>=1.27.7",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "gradio==5.49.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.6",
    "langserve>=0.3.3",
    "llama-index-core>=0.12.0,<0.13",
    "llama-index-embeddings-dashscope>=0.3.0,<0.4",
    "llama-index-embeddings-langchain>=0.3.0,<0.4",
    "llama-index-llms-dashscope>=0.3.1,<0.4",
    "llama-index-llms-langchain>=0.6.1,<0.7",
    "llama-index-readers-file>=0.4.9,<0.5",
    "llama-index-readers-json>=0.3.0,<0.4",
    "llama-index-vector-stores-chroma>=0.4.2,<0.5",
    "mypy-extensions>=1.1.0",
    "mysqlclient==2.2.7",
    "notebook>=7.6.3",
    "ollama>=0.6.3",
    "openai>=3.22.1",
    "passlib[bcrypt]>=1.7.4",
    "pip>=26.2.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.11.10",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "pyvis>=0.3.2",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "sse-starlette>=3.5.0",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
llm-app-development = "llm-app-development:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 清华镜像对 llama-index 系列更新滞后，追加阿里云镜像以获取较新版本
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
